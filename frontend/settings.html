<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - AI Call Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 AI Call Assistant</h1>
            <nav>
                <a href="/">Dashboard</a>
                <a href="/settings.html" class="active">Settings</a>
                <a href="#">Logs</a>
            </nav>
        </header>

        <main>
            <div class="content-grid">
                <section class="card settings-card">
                    <div class="card__header">
                        <h2>AI Configuration</h2>
                        <p>Define the personality and instructions for your AI assistant.</p>
                    </div>
                    <div class="card__body">
                        <div class="form-group">
                            <label for="ai-prompt">AI System Prompt</label>
                            <textarea id="ai-prompt" class="form-control" rows="10" placeholder="e.g., You are a friendly and professional assistant named Echo. Your goal is to take a message and find out the caller's name and reason for calling..."></textarea>
                        </div>
                    </div>
                    <div class="card__footer">
                        <p id="status-message" class="status-message"></p>
                        <button id="save-prompt-btn" class="btn btn-primary">Save Prompt</button>
                    </div>
                </section>
    
                <section class="card connectivity-card">
                    <div class="card__header">
                        <h2>Connectivity Status</h2>
                        <p>Check the backend's connection to required services.</p>
                    </div>
                    <div class="card__body">
                        <ul class="status-list">
                            <li class="status-list__item"><span>Database (MongoDB)</span><span id="status-database" class="status-badge">--</span></li>
                            <li class="status-list__item"><span>Telephony (Twilio)</span><span id="status-twilio" class="status-badge">--</span></li>
                            <li class="status-list__item"><span>AI Provider (Gemini)</span><span id="status-gemini" class="status-badge">--</span></li>
                        </ul>
                    </div>
                    <div class="card__footer">
                        <button id="check-status-btn" class="btn">Check Status</button>
                    </div>
                </section>
            </div>
        </main>
    </div>
    <script src="settings.js"></script>
</body>
</html>
